name: Check app info

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  check-info:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save google-play-scraper
      - name: Fetch app info
        run: |
          node -e "
          const gplay = require('google-play-scraper').default;
          gplay.app({appId: 'com.ha.nep.hexa8085'}).then(result => {
            console.log('::group::App Info');
            console.log('Version:', result.version);
            console.log('Icon:', result.icon);
            console.log('Screenshots:');
            (result.screenshots || []).forEach((url, i) => console.log('  ' + (i+1) + '.', url));
            console.log('::endgroup::');
          }).catch(console.error);
          "
